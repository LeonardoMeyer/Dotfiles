source = /home/$USER/.cache/wal/colors-hyprland
$player = ~/.config/hypr/utilities/player.sh

$pdir = /run/user/1000/hyprlock-player

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
    animation = inputFieldFade, 1, 4, easeOutQuint
    animation = inputFieldWidth, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 3, easeOutQuint
}

background {
    monitor =
    path = $wallpaper
    blur_size = 5
    blur_passes = 3
    brightness = .6
}

input-field {
    monitor = DP-5
    size = 6%, 4%
    outline_thickness = 0
    dots_rounding = 4
    dots_spacing = .5
    inner_color = $backgroundCol
    outer_color = $color9 $color9
    check_color = $color9 $color9
    fail_color = $color1 $color1
    font_color = $color9
    font_family = CodeNewRoman Nerd Font Propo
    fade_on_empty = false
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 2
    shadow_size = 2
    rounding = 20
    placeholder_text = <i></i>
    fail_text = <b>FAIL</b>
    position = 0, -100
    halign = center
    valign = center
}

input-field {
    monitor = eDP-1
    size = 6%, 4%
    outline_thickness = 0
    dots_rounding = 4
    dots_spacing = .5
    inner_color = $backgroundCol
    outer_color = $color9 $color9
    check_color = $color9 $color9
    fail_color = $color1 $color1
    font_color = $color9
    font_family = CodeNewRoman Nerd Font Propo
    fade_on_empty = false
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 2
    shadow_size = 2
    rounding = 20
    placeholder_text = <i></i>
    fail_text = <b>FAIL</b>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor = DP-5
    text = <i>Hello</i> <b>$USER</b>
    color = $color5
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = <i>Hello</i> <b>$USER</b>
    color = $color5
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor = DP-4
    text = cmd[update:1000] date +"<b>%I</b>:<b>%M</b>"
    color = $color9
    font_size = 120
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor = DP-4
    text = cmd[update:1000] date +"<b>%A, %B %d, %Y</b>"
    color = $color4
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 350
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = cmd[update:1000] date +"<b>%I</b>:<b>%M</b>"
    color = $color9
    font_size = 120
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] $player ensure
    color = rgba(0,0,0,0)
    font_size = 1
    position = 0, 0
    halign = center
    valign = center
}

image {
    monitor = DP-5
    path = ~/.cache/hyprlock-player/card.png
    reload_time = 1
    size = 200
    rounding = 20
    border_size = 0
    position = 38%, -37%
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor = DP-5
    text = cmd[update:40] cat $pdir/title 2>/dev/null
    color = $color9
    font_size = 22
    font_family = CodeNewRoman Nerd Font Propo
    position = 38%, -32.8%
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor = DP-5
    text = cmd[update:40] cat $pdir/artist 2>/dev/null
    color = $color5
    font_size = 15
    font_family = CodeNewRoman Nerd Font Propo
    position = 38%, -36.1%
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor = DP-5
    text = cmd[update:40] cat $pdir/prev 2>/dev/null
    color = $color9
    font_size = 20
    font_family = CodeNewRoman Nerd Font Mono
    position = 34.4%, -41.2%
    halign = center
    valign = center
    zindex = 1
    onclick = sh -c '~/.config/hypr/utilities/player.sh press prev'
}

label {
    monitor = DP-5
    text = cmd[update:40] cat $pdir/toggle 2>/dev/null
