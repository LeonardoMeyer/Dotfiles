# Run Spotify natively on Wayland. Under XWayland it misses being moved right after it opens (the pypr
# scratchpad does exactly that), and clicks then land offset by the distance it moved.
# --password-store=basic keeps the saved login out of the keyring, which autologin leaves locked: without it Spotify
# can't read its login after a reboot and asks to sign in again.
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland", "--password-store=basic"]
