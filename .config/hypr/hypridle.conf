source = /home/$USER/.cache/wal/colors-hyprland

# Hex: sem bloqueio por tempo. Só bloqueia no SUPER+L ou no botão de bloquear.
general {
    lock_cmd = ~/.config/hypr/utilities/lock.sh
    ignore_dbus_inhibit = /opt/spotify/spotify
}

# apaga os monitores depois de 40 min parado (não bloqueia)
listener {
    timeout = 2400
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
